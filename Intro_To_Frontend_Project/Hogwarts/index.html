<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hogwarts House Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h1>Hogwarts House Generator</h1>
    <p class="subtitle">Type your name to get sorted into a Hogwarts house.</p>

    <input id="nameInput" type="text" placeholder="Enter your name">
    <button id="getHouseBtn" type="button">Get House</button>
    <button id="tryAgainBtn" type="button">Try Again</button>

    <p id="result"></p>
    <p id="trait"></p>
  </div>

  <script src="main.js"></script>
</body>
</html>
